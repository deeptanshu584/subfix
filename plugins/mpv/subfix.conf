# subfix mpv plugin options. Copy to <mpv config dir>\script-opts\subfix.conf
# Format: key=value, no quotes, no spaces around "=". Lines starting with # are comments.

# Full path to subfix.exe (or just "subfix" if it is on PATH).
executable=<repo>\.venv\Scripts\subfix.exe

# Sync mode when subtitles exist: auto | offset | drift | piecewise | smart
mode=auto

# Whisper device: auto | cuda | cpu
device=auto

# Whisper model, e.g. large-v3-turbo, small (empty = chosen for your hardware)
model=

# Spoken language code, e.g. en, fr (empty = auto-detect)
lang=

# Extra arguments added to every subfix call (double quotes group words), e.g.
#   extra_args=--no-cache --audio-track 1
extra_args=

# Seconds the final "loaded ..." / error message stays on screen
osd_duration=6

# yes = Ctrl+Shift+S syncs the currently selected external subtitle track
# no  = let subfix pick the subtitle file next to the video
use_selected_sub=yes

# Show "subfix: working... 0:42" while subfix runs
show_progress=yes
